services:
  speaker-recognition:
    image: ghcr.io/conorod1992/speaker-recognition:latest
    container_name: speaker-recognition
    restart: unless-stopped
    ports:
      - "8099:8099"
    environment:
      # Server configuration
      - HOST=0.0.0.0
      - PORT=8099

      # Logging configuration
      - LOG_LEVEL=INFO
      - ACCESS_LOG=true

      # Storage configuration
      - EMBEDDINGS_DIR=/data/embeddings
      - MODEL_CACHE_DIR=/data/models

      # Experimental model comparison. Keep disabled for normal operation.
      - SHADOW_ENGINE=${SHADOW_ENGINE:-none}

      # Remote API security. Compose fails fast if API_TOKEN is not set.
      - API_TOKEN=${API_TOKEN:?Set API_TOKEN before starting Speaker Recognition}
      - ALLOW_INSECURE_REMOTE=false
    volumes:
      # Persist embeddings and optional downloaded shadow models.
      - ./embeddings:/data/embeddings
      - ./models:/data/models
