name: Republish release

# Recovery-only workflow. Normal releases build and verify every package/image
# in release.yml before master advertises the new add-on version.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.set_output.outputs.version }}
    env:
      VERSION: ""
    steps:
      - name: Get latest release from API
        id: release_api
        uses: octokit/request-action@v2.x
        with:
          route: GET /repos/${{ github.repository }}/releases/latest
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Parse API response
        run: |
          echo "VERSION=${{ fromJson(steps.release_api.outputs.data).tag_name }}" >> "$GITHUB_ENV"

      - name: Fail if no version
        run: |
          if [[ -z "$VERSION" ]]; then
            echo "Missing release version"
            exit 1
          fi

      - name: Set output
        id: set_output
        run: echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  package:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.version.outputs.version }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.9"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.9"
          enable-cache: true
          cache-suffix: uv-${{ runner.os }}-3.9

      - name: Install dependencies
        run: uv sync --locked --all-groups

      - name: Verify package version matches release tag
        env:
          RELEASE_VERSION: ${{ needs.version.outputs.version }}
        shell: python
        run: |
          from pathlib import Path
          import os
          import re

          expected = os.environ["RELEASE_VERSION"].removeprefix("v")
          pyproject = Path("pyproject.toml").read_text(encoding="utf-8")
          match = re.search(r'(?m)^version = "([^"]+)"$', pyproject)
          if match is None or match.group(1) != expected:
              raise RuntimeError(
                  f"Release tag {expected!r} does not match pyproject version "
                  f"{match.group(1) if match else None!r}"
              )

      - name: Build package
        run: uv build

      - name: Upload packages to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ needs.version.outputs.version }}" dist/*.tar.gz dist/*.whl --clobber

  docker:
    needs: version
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.version.outputs.version }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=${{ needs.version.outputs.version }}
            type=raw,value=latest

      - name: Build and publish Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  build-addon:
    needs: version
    runs-on: ubuntu-latest
    name: Build ${{ matrix.arch }} add-on
    strategy:
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
          - arch: aarch64
            platform: linux/arm64
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out release tag
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.version.outputs.version }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and publish add-on
        uses: docker/build-push-action@v6
        with:
          context: ./speaker_recognition_addon
          platforms: ${{ matrix.platform }}
          build-args: |
            BUILD_ARCH=${{ matrix.arch }}
            BUILD_VERSION=${{ needs.version.outputs.version }}
          cache-from: type=gha,scope=speaker-recognition-addon-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=speaker-recognition-addon-${{ matrix.arch }}
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/${{ matrix.arch }}-speaker-recognition-addon:${{ needs.version.outputs.version }}
