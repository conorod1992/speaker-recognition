name: Transactional enrollment patch

on:
  push:
    branches:
      - fix/transactional-sidebar-enrollment
    paths:
      - .github/workflows/transactional-enrollment-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/transactional-sidebar-enrollment

      - name: Apply transactional enrollment fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              if old not in text:
                  raise RuntimeError(f"Expected patch target not found in {path}")
              p.write_text(text.replace(old, new, 1), encoding="utf-8")

          replace(
              "custom_components/speaker_recognition/enrollment.py",
              '    relative = f"{_MEDIA_SUBDIR}/{safe_user}/sample_{sample_index + 1}.wav"\n',
              '    generation = secrets.token_urlsafe(8)\n'
              '    relative = (\n'
              '        f"{_MEDIA_SUBDIR}/{safe_user}/"\n'
              '        f"sample_{sample_index + 1}_{generation}.wav"\n'
              '    )\n',
          )

          replace(
              "custom_components/speaker_recognition/websocket.py",
              'import base64\nfrom typing import Any\n',
              'import asyncio\nimport base64\nfrom typing import Any\n',
          )
          replace(
              "custom_components/speaker_recognition/websocket.py",
              '@websocket_api.require_admin\n@callback\ndef websocket_commit_enrollment(\n',
              '@websocket_api.require_admin\n@websocket_api.async_response\nasync def websocket_commit_enrollment(\n',
          )
          old_commit = '''    options = dict(entry.options)\n    options[CONF_VOICE_SAMPLES] = _replace_user_samples(\n        list(options.get(CONF_VOICE_SAMPLES, [])), msg["user_id"], ordered\n    )\n    hass.config_entries.async_update_entry(entry, options=options)\n    connection.send_result(msg["id"], {"committed": True, "samples": len(ordered)})\n'''
          new_commit = '''    user_id = msg["user_id"]\n    domain_data = hass.data.setdefault(DOMAIN, {})\n    waiters = domain_data.setdefault("enrollment_commit_waiters", {})\n    existing_waiter = waiters.get(user_id)\n    if existing_waiter is not None and not existing_waiter.done():\n        connection.send_error(\n            msg["id"], "commit_in_progress", "Enrollment is already being committed"\n        )\n        return\n\n    completion = hass.loop.create_future()\n    waiters[user_id] = completion\n    options = dict(entry.options)\n    options[CONF_VOICE_SAMPLES] = _replace_user_samples(\n        list(options.get(CONF_VOICE_SAMPLES, [])), user_id, ordered\n    )\n    hass.config_entries.async_update_entry(entry, options=options)\n\n    try:\n        succeeded = await asyncio.wait_for(asyncio.shield(completion), timeout=305)\n    except asyncio.TimeoutError:\n        connection.send_error(\n            msg["id"],\n            "training_timeout",\n            "Speaker training did not finish in time; the previous enrollment remains active",\n        )\n        return\n    finally:\n        if waiters.get(user_id) is completion:\n            waiters.pop(user_id, None)\n\n    if not succeeded:\n        connection.send_error(\n            msg["id"],\n            "training_failed",\n            "Speaker training failed; the previous enrollment remains active",\n        )\n        return\n\n    connection.send_result(msg["id"], {"committed": True, "samples": len(ordered)})\n'''
          replace("custom_components/speaker_recognition/websocket.py", old_commit, new_commit)

          insert_after = '''def _get_main_entry(hass: HomeAssistant) -> ConfigEntry | None:\n    """Get the main config entry."""\n    entries = hass.config_entries.async_entries(__name__.rsplit(".", maxsplit=1)[-1])\n    for entry in entries:\n        if entry.data.get(CONF_ENTRY_TYPE) == ENTRY_TYPE_MAIN:\n            return entry\n    return None\n\n\n'''
          helper = '''def _resolve_enrollment_commits(\n    hass: HomeAssistant, user_ids: set[str], succeeded: bool\n) -> None:\n    """Resolve sidebar enrollment commits after backend training finishes."""\n    waiters = hass.data.get(DOMAIN, {}).get("enrollment_commit_waiters")\n    if not isinstance(waiters, dict):\n        return\n    for user_id in user_ids:\n        completion = waiters.get(user_id)\n        if completion is not None and not completion.done():\n            completion.set_result(succeeded)\n\n\n'''
          replace("custom_components/speaker_recognition/__init__.py", insert_after, insert_after + helper)
          replace(
              "custom_components/speaker_recognition/__init__.py",
              '''    except EnrollmentUpdateFailed as error:\n        updated_options = dict(entry.options)\n        updated_options[CONF_VOICE_SAMPLES] = error.previous_samples\n        hass.config_entries.async_update_entry(entry, options=updated_options)\n        return\n''',
              '''    except EnrollmentUpdateFailed as error:\n        updated_options = dict(entry.options)\n        updated_options[CONF_VOICE_SAMPLES] = error.previous_samples\n        hass.config_entries.async_update_entry(entry, options=updated_options)\n        _resolve_enrollment_commits(hass, error.changed_users, False)\n        return\n''',
          )
          replace(
              "custom_components/speaker_recognition/__init__.py",
              '''    if changed_users and isinstance(staged, dict):\n        for user_id in changed_users:\n            staged.pop(user_id, None)\n\n    await hass.config_entries.async_reload(entry.entry_id)\n''',
              '''    if changed_users and isinstance(staged, dict):\n        for user_id in changed_users:\n            staged.pop(user_id, None)\n\n    _resolve_enrollment_commits(hass, changed_users, True)\n    await hass.config_entries.async_reload(entry.entry_id)\n''',
          )

          Path("tests/test_transactional_enrollment_contract.py").write_text('''"""Regression contracts for transactional sidebar enrollment."""\n\nfrom pathlib import Path\n\nROOT = Path(__file__).parents[1]\nHA = ROOT / "custom_components" / "speaker_recognition"\n\n\ndef test_staged_recordings_use_unique_media_paths() -> None:\n    source = (HA / "enrollment.py").read_text(encoding="utf-8")\n    assert "generation = secrets.token_urlsafe" in source\n    assert "sample_{sample_index + 1}_{generation}.wav" in source\n    assert 'sample_{sample_index + 1}.wav"' not in source\n\n\ndef test_commit_waits_for_backend_training_result() -> None:\n    source = (HA / "websocket.py").read_text(encoding="utf-8")\n    assert "@websocket_api.async_response" in source\n    assert '"enrollment_commit_waiters"' in source\n    assert "await asyncio.wait_for(asyncio.shield(completion)" in source\n    assert '"training_failed"' in source\n    assert '"training_timeout"' in source\n\n\ndef test_update_listener_reports_training_success_or_failure() -> None:\n    source = (HA / "__init__.py").read_text(encoding="utf-8")\n    assert "def _resolve_enrollment_commits(" in source\n    assert "_resolve_enrollment_commits(hass, error.changed_users, False)" in source\n    assert "_resolve_enrollment_commits(hass, changed_users, True)" in source\n''', encoding="utf-8")
          PY

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add custom_components/speaker_recognition/enrollment.py \
            custom_components/speaker_recognition/websocket.py \
            custom_components/speaker_recognition/__init__.py \
            tests/test_transactional_enrollment_contract.py
          git diff --cached --check
          git commit -m "fix: make sidebar enrollment transactional"
          git push origin HEAD:fix/transactional-sidebar-enrollment
