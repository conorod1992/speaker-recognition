name: Backend boundary patch

on:
  push:
    branches: [fix/backend-boundary-hardening]
    paths: [.github/workflows/backend-boundary-patch.yml]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/backend-boundary-hardening
      - name: Apply hardening
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path, old, new, count=1):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if old not in text:
                  raise RuntimeError(f'target missing: {path}: {old[:80]!r}')
              p.write_text(text.replace(old, new, count), encoding='utf-8')

          # Backend transport and aggregate budgets.
          replace(
              'speaker_recognition/const.py',
              'MAX_TRAINING_SAMPLES = 48\n',
              'MAX_TRAINING_SAMPLES = 48\nMAX_TRAINING_AUDIO_BYTES = 64 * 1024 * 1024\nMAX_REQUEST_BODY_BYTES = 96 * 1024 * 1024\n',
          )
          replace(
              'speaker_recognition/models.py',
              'from pydantic import BaseModel, ConfigDict, Field\n',
              'from pydantic import BaseModel, ConfigDict, Field, model_validator\n',
          )
          replace(
              'speaker_recognition/models.py',
              '    MAX_SAMPLE_RATE,\n    MAX_TRAINING_SAMPLES,\n',
              '    MAX_SAMPLE_RATE,\n    MAX_TRAINING_AUDIO_BYTES,\n    MAX_TRAINING_SAMPLES,\n',
          )
          replace(
              'speaker_recognition/models.py',
              '''    voice_samples: list[VoiceSample] = Field(\n        ...,\n        min_length=1,\n        max_length=MAX_TRAINING_SAMPLES,\n        description="List of voice samples",\n    )\n''',
              '''    voice_samples: list[VoiceSample] = Field(\n        ...,\n        min_length=1,\n        max_length=MAX_TRAINING_SAMPLES,\n        description="List of voice samples",\n    )\n\n    @model_validator(mode="after")\n    def validate_total_audio_budget(self) -> "TrainingRequest":\n        """Reject requests whose combined decoded audio can exhaust memory."""\n        estimated_bytes = sum(\n            (len(sample.audio.audio_data) * 3 + 3) // 4\n            for sample in self.voice_samples\n        )\n        if estimated_bytes > MAX_TRAINING_AUDIO_BYTES:\n            raise ValueError(\n                "Combined training audio exceeds the 64 MiB request budget"\n            )\n        return self\n''',
          )
          replace(
              'speaker_recognition/api.py',
              'from fastapi import Depends, FastAPI, Header, HTTPException, Request\n',
              'from fastapi import Depends, FastAPI, Header, HTTPException, Request\nfrom starlette.responses import JSONResponse\n\nfrom speaker_recognition.const import MAX_REQUEST_BODY_BYTES\n',
          )
          marker = '''_TRUSTED_LOCAL_HOSTS = {"172.30.32.1"}\n\n\n'''
          middleware = '''_TRUSTED_LOCAL_HOSTS = {"172.30.32.1"}\n\n\nclass RequestBodyTooLarge(Exception):\n    """Raised when an HTTP request exceeds the configured transport budget."""\n\n\nclass RequestBodyLimitMiddleware:\n    """Reject oversized Content-Length and chunked HTTP request bodies."""\n\n    def __init__(self, app, max_body_size: int) -> None:\n        self.app = app\n        self.max_body_size = max_body_size\n\n    async def __call__(self, scope, receive, send) -> None:\n        if scope.get("type") != "http":\n            await self.app(scope, receive, send)\n            return\n\n        headers = {key.lower(): value for key, value in scope.get("headers", [])}\n        content_length = headers.get(b"content-length")\n        if content_length is not None:\n            try:\n                if int(content_length) > self.max_body_size:\n                    response = JSONResponse(\n                        {"detail": "Request body exceeds the 96 MiB limit"},\n                        status_code=413,\n                    )\n                    await response(scope, receive, send)\n                    return\n            except ValueError:\n                pass\n\n        received = 0\n\n        async def limited_receive():\n            nonlocal received\n            message = await receive()\n            if message.get("type") == "http.request":\n                received += len(message.get("body", b""))\n                if received > self.max_body_size:\n                    raise RequestBodyTooLarge\n            return message\n\n        try:\n            await self.app(scope, limited_receive, send)\n        except RequestBodyTooLarge:\n            response = JSONResponse(\n                {"detail": "Request body exceeds the 96 MiB limit"},\n                status_code=413,\n            )\n            await response(scope, receive, send)\n\n\n'''
          replace('speaker_recognition/api.py', marker, middleware)
          replace(
              'speaker_recognition/api.py',
              '''app = FastAPI(\n    title="Speaker Recognition Service",\n    description="API for training and recognizing speakers using voice samples",\n    version="2.8.0",\n    dependencies=[Depends(require_api_access)],\n)\n''',
              '''app = FastAPI(\n    title="Speaker Recognition Service",\n    description="API for training and recognizing speakers using voice samples",\n    version="2.8.0",\n    dependencies=[Depends(require_api_access)],\n)\napp.add_middleware(RequestBodyLimitMiddleware, max_body_size=MAX_REQUEST_BODY_BYTES)\n''',
          )

          # Bounded/stat-first Home Assistant media reads.
          replace(
              'custom_components/speaker_recognition/audio.py',
              'from io import BytesIO\nimport wave\n',
              'from io import BytesIO\nfrom pathlib import Path\nimport wave\n',
          )
          replace(
              'custom_components/speaker_recognition/audio.py',
              'MAX_UPLOADED_WAV_SECONDS = 30\n',
              'MAX_UPLOADED_WAV_SECONDS = 30\nMAX_LOCAL_WAV_BYTES = 16 * 1024 * 1024\n\n\ndef read_bounded_wav(path: Path) -> bytes:\n    """Read a local WAV only after enforcing a stat-first size budget."""\n    if path.stat().st_size > MAX_LOCAL_WAV_BYTES:\n        raise ValueError("WAV file exceeds the 16 MiB upload limit")\n    with path.open("rb") as stream:\n        data = stream.read(MAX_LOCAL_WAV_BYTES + 1)\n    if len(data) > MAX_LOCAL_WAV_BYTES:\n        raise ValueError("WAV file exceeds the 16 MiB upload limit")\n    return data\n',
          )
          replace(
              'custom_components/speaker_recognition/recognition.py',
              'from .audio import decode_wav\n',
              'from .audio import decode_wav, read_bounded_wav\n',
          )
          replace(
              'custom_components/speaker_recognition/recognition.py',
              '        return await self.hass.async_add_executor_job(resolved_media.path.read_bytes)\n',
              '        return await self.hass.async_add_executor_job(read_bounded_wav, resolved_media.path)\n',
          )
          replace(
              'custom_components/speaker_recognition/config_flow.py',
              'from .audio import decode_wav\n',
              'from .audio import decode_wav, read_bounded_wav\n',
          )
          replace(
              'custom_components/speaker_recognition/config_flow.py',
              '    audio_data = await hass.async_add_executor_job(resolved_media.path.read_bytes)\n',
              '    audio_data = await hass.async_add_executor_job(read_bounded_wav, resolved_media.path)\n',
          )

          # Explicit backend API token in HA configuration/client.
          replace(
              'custom_components/speaker_recognition/const.py',
              'CONF_BACKEND_URL = "backend_url"\n',
              'CONF_BACKEND_URL = "backend_url"\nCONF_BACKEND_TOKEN = "backend_token"\n',
          )
          replace(
              'custom_components/speaker_recognition/const.py',
              '''def effective_backend_url(data: Mapping[str, Any], options: Mapping[str, Any]) -> str:\n    """Return the current backend URL using runtime precedence."""\n    value = options.get(CONF_BACKEND_URL, data.get(CONF_BACKEND_URL))\n    return value if isinstance(value, str) else DEFAULT_BACKEND_URL\n\n\n''',
              '''def effective_backend_url(data: Mapping[str, Any], options: Mapping[str, Any]) -> str:\n    """Return the current backend URL using runtime precedence."""\n    value = options.get(CONF_BACKEND_URL, data.get(CONF_BACKEND_URL))\n    return value if isinstance(value, str) else DEFAULT_BACKEND_URL\n\n\ndef effective_backend_token(data: Mapping[str, Any], options: Mapping[str, Any]) -> str:\n    """Return the optional API token for a remote standalone backend."""\n    value = options.get(CONF_BACKEND_TOKEN, data.get(CONF_BACKEND_TOKEN, ""))\n    return value if isinstance(value, str) else ""\n\n\n''',
          )
          replace(
              'custom_components/speaker_recognition/recognition.py',
              '''    def __init__(\n        self,\n        hass: HomeAssistant,\n        voice_samples: list[dict],\n        base_url: str = DEFAULT_ADDON_URL,\n    ) -> None:\n''',
              '''    def __init__(\n        self,\n        hass: HomeAssistant,\n        voice_samples: list[dict],\n        base_url: str = DEFAULT_ADDON_URL,\n        api_token: str = "",\n    ) -> None:\n''',
          )
          replace(
              'custom_components/speaker_recognition/recognition.py',
              '        self._base_url = base_url.rstrip("/")\n',
              '        self._base_url = base_url.rstrip("/")\n        self._api_token = api_token.strip()\n\n    def _request_headers(self) -> dict[str, str]:\n        """Return authorization headers for a secured remote backend."""\n        if not self._api_token:\n            return {}\n        return {"Authorization": f"Bearer {self._api_token}"}\n',
          )
          replace(
              'custom_components/speaker_recognition/recognition.py',
              '            json=payload,\n            timeout=ClientTimeout(total=timeout_seconds),\n',
              '            json=payload,\n            headers=self._request_headers(),\n            timeout=ClientTimeout(total=timeout_seconds),\n',
          )
          replace(
              'custom_components/speaker_recognition/recognition.py',
              '            f"{self._base_url}{path}", timeout=ClientTimeout(total=10)\n',
              '            f"{self._base_url}{path}",\n            headers=self._request_headers(),\n            timeout=ClientTimeout(total=10),\n',
          )
          replace(
              'custom_components/speaker_recognition/__init__.py',
              '    CONF_BACKEND_URL,\n',
              '    CONF_BACKEND_TOKEN,\n    CONF_BACKEND_URL,\n',
          ) if False else None
          # __init__ imports effective helper, not the raw constants near current context.
          replace(
              'custom_components/speaker_recognition/__init__.py',
              '    effective_backend_url,\n',
              '    effective_backend_token,\n    effective_backend_url,\n',
          )
          replace(
              'custom_components/speaker_recognition/__init__.py',
              '''    backend_url = effective_backend_url(entry.data, entry.options)\n    voice_samples = entry.options.get(CONF_VOICE_SAMPLES, [])\n    recognition = SpeakerRecognition(hass, voice_samples, backend_url)\n''',
              '''    backend_url = effective_backend_url(entry.data, entry.options)\n    backend_token = effective_backend_token(entry.data, entry.options)\n    voice_samples = entry.options.get(CONF_VOICE_SAMPLES, [])\n    recognition = SpeakerRecognition(hass, voice_samples, backend_url, backend_token)\n''',
          )

          replace(
              'custom_components/speaker_recognition/config_flow.py',
              '    CONF_BACKEND_URL,\n',
              '    CONF_BACKEND_TOKEN,\n    CONF_BACKEND_URL,\n',
          )
          replace(
              'custom_components/speaker_recognition/config_flow.py',
              '    effective_backend_url,\n',
              '    effective_backend_token,\n    effective_backend_url,\n',
          )
          replace(
              'custom_components/speaker_recognition/config_flow.py',
              '    _pending_backend_url: str\n',
              '    _pending_backend_url: str\n    _pending_backend_token: str\n',
          )
          replace(
              'custom_components/speaker_recognition/config_flow.py',
              '            self._pending_backend_url = user_input[CONF_BACKEND_URL]\n',
              '            self._pending_backend_url = user_input[CONF_BACKEND_URL]\n            self._pending_backend_token = user_input.get(CONF_BACKEND_TOKEN, "")\n',
          )
          replace(
              'custom_components/speaker_recognition/config_flow.py',
              '''                    vol.Required(\n                        CONF_BACKEND_URL, default=DEFAULT_BACKEND_URL\n                    ): selector.TextSelector(),\n''',
              '''                    vol.Required(\n                        CONF_BACKEND_URL, default=DEFAULT_BACKEND_URL\n                    ): selector.TextSelector(),\n                    vol.Optional(CONF_BACKEND_TOKEN, default=""): selector.TextSelector(),\n''',
              count=1,
          )
          replace(
              'custom_components/speaker_recognition/config_flow.py',
              '                CONF_BACKEND_URL: self._pending_backend_url,\n',
              '                CONF_BACKEND_URL: self._pending_backend_url,\n                CONF_BACKEND_TOKEN: self._pending_backend_token,\n',
          )
          replace(
              'custom_components/speaker_recognition/config_flow.py',
              '''                data={\n                    CONF_BACKEND_URL: user_input[CONF_BACKEND_URL],\n                    CONF_VOICE_SAMPLES: self.config_entry.options.get(\n''',
              '''                data={\n                    CONF_BACKEND_URL: user_input[CONF_BACKEND_URL],\n                    CONF_BACKEND_TOKEN: user_input.get(CONF_BACKEND_TOKEN, ""),\n                    CONF_VOICE_SAMPLES: self.config_entry.options.get(\n''',
          )
          replace(
              'custom_components/speaker_recognition/config_flow.py',
              '''        current_url = effective_backend_url(\n            self.config_entry.data, self.config_entry.options\n        )\n        return self.async_show_form(\n''',
              '''        current_url = effective_backend_url(\n            self.config_entry.data, self.config_entry.options\n        )\n        current_token = effective_backend_token(\n            self.config_entry.data, self.config_entry.options\n        )\n        return self.async_show_form(\n''',
              count=1,
          )
          # Add token to main options form (the second backend URL schema occurrence).
          old = '''                    vol.Required(\n                        CONF_BACKEND_URL, default=current_url\n                    ): selector.TextSelector(),\n'''
          new = '''                    vol.Required(\n                        CONF_BACKEND_URL, default=current_url\n                    ): selector.TextSelector(),\n                    vol.Optional(\n                        CONF_BACKEND_TOKEN, default=current_token\n                    ): selector.TextSelector(),\n'''
          replace('custom_components/speaker_recognition/config_flow.py', old, new)
          replace(
              'custom_components/speaker_recognition/config_flow.py',
              '''        current_url = effective_backend_url(\n            self.config_entry.data, self.config_entry.options\n        )\n        return self.async_create_entry(\n            title="",\n            data={\n                CONF_BACKEND_URL: current_url,\n''',
              '''        current_url = effective_backend_url(\n            self.config_entry.data, self.config_entry.options\n        )\n        current_token = effective_backend_token(\n            self.config_entry.data, self.config_entry.options\n        )\n        return self.async_create_entry(\n            title="",\n            data={\n                CONF_BACKEND_URL: current_url,\n                CONF_BACKEND_TOKEN: current_token,\n''',
          )

          # Documentation: secure standalone example.
          replace(
              'README.md',
              '''docker run -d \\\n  -p 8099:8099 \\\n  -v ./embeddings:/app/embeddings \\\n  ghcr.io/conorod1992/speaker-recognition:latest\n''',
              '''docker run -d \\\n  -p 8099:8099 \\\n  -e API_TOKEN="replace-with-a-long-random-token" \\\n  -v ./embeddings:/app/embeddings \\\n  ghcr.io/conorod1992/speaker-recognition:latest\n''',
          )
          replace(
              'README.md',
              '''http://192.168.1.50:8099\n```\n\n---\n''',
              '''http://192.168.1.50:8099\n```\n\nEnter the same value from `API_TOKEN` in the integration's **Backend API token**\nfield. Remote standalone backends reject unauthenticated requests by default.\nThe Home Assistant OS/Supervised add-on path does not require this token because\nthe Supervisor gateway is trusted locally.\n\n---\n''',
          )

          # Regression tests.
          Path('tests/test_backend_boundary_contract.py').write_text('''"""Contracts for secure remote backends and memory budgets."""\n\nfrom pathlib import Path\n\nimport pytest\nfrom pydantic import ValidationError\n\nfrom speaker_recognition.const import MAX_TRAINING_AUDIO_BYTES\nfrom speaker_recognition.models import AudioInput, TrainingRequest, VoiceSample\n\nROOT = Path(__file__).parents[1]\nHA = ROOT / "custom_components" / "speaker_recognition"\n\n\ndef test_training_request_has_aggregate_audio_budget() -> None:\n    encoded = "A" * (((MAX_TRAINING_AUDIO_BYTES // 2) * 4 // 3) + 1024)\n    sample = VoiceSample(user="alice", audio=AudioInput(audio_data=encoded, sample_rate=16000))\n    with pytest.raises(ValidationError):\n        TrainingRequest(voice_samples=[sample, sample, sample])\n\n\ndef test_remote_backend_token_is_first_class_ha_configuration() -> None:\n    const = (HA / "const.py").read_text(encoding="utf-8")\n    recognition = (HA / "recognition.py").read_text(encoding="utf-8")\n    config_flow = (HA / "config_flow.py").read_text(encoding="utf-8")\n    assert 'CONF_BACKEND_TOKEN = "backend_token"' in const\n    assert '"Authorization": f"Bearer {self._api_token}"' in recognition\n    assert "CONF_BACKEND_TOKEN" in config_flow\n\n\ndef test_local_media_reads_are_stat_first_and_bounded() -> None:\n    audio = (HA / "audio.py").read_text(encoding="utf-8")\n    recognition = (HA / "recognition.py").read_text(encoding="utf-8")\n    config_flow = (HA / "config_flow.py").read_text(encoding="utf-8")\n    assert "path.stat().st_size > MAX_LOCAL_WAV_BYTES" in audio\n    assert "stream.read(MAX_LOCAL_WAV_BYTES + 1)" in audio\n    assert "read_bounded_wav" in recognition\n    assert "read_bounded_wav" in config_flow\n\n\ndef test_backend_has_transport_body_limit() -> None:\n    api = (ROOT / "speaker_recognition" / "api.py").read_text(encoding="utf-8")\n    assert "RequestBodyLimitMiddleware" in api\n    assert "MAX_REQUEST_BODY_BYTES" in api\n''', encoding='utf-8')

          # Keep add-on backend copy synchronized.
          import subprocess
          subprocess.run(['python', 'scripts/sync_addon_sources.py'], check=True)
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add speaker_recognition speaker_recognition_addon/speaker_recognition custom_components/speaker_recognition README.md tests/test_backend_boundary_contract.py
          git diff --cached --check
          git commit -m "fix: harden remote backend request boundaries"
          git push origin HEAD:fix/backend-boundary-hardening
