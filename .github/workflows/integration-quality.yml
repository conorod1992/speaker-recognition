name: Integration Quality

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  integration-lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Lint Home Assistant integration
        run: uvx ruff check custom_components/speaker_recognition

      - name: Compile Home Assistant integration
        run: python -m compileall -q custom_components/speaker_recognition
