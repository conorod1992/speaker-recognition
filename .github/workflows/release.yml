name: Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    concurrency: release
    steps:
      - name: Checkout master
        uses: actions/checkout@v6
        with:
          ref: master
          fetch-depth: 0

      - name: Read and verify release version
        id: version
        shell: python
        run: |
          from pathlib import Path
          import json
          import os
          import re

          pyproject = Path("pyproject.toml").read_text(encoding="utf-8")
          match = re.search(r'(?m)^version = "([^"]+)"$', pyproject)
          if match is None:
              raise RuntimeError("Could not find project version in pyproject.toml")
          version = match.group(1)

          manifest = json.loads(
              Path("custom_components/speaker_recognition/manifest.json").read_text(
                  encoding="utf-8"
              )
          )
          if manifest.get("version") != version:
              raise RuntimeError("Home Assistant manifest version does not match pyproject.toml")

          addon = Path("speaker_recognition_addon/config.yaml").read_text(encoding="utf-8")
          if f'version: "{version}"' not in addon:
              raise RuntimeError("Add-on version does not match pyproject.toml")

          for path in (
              Path("speaker_recognition/api.py"),
              Path("speaker_recognition_addon/speaker_recognition/api.py"),
              Path("speaker_recognition_addon/Dockerfile"),
          ):
              if version not in path.read_text(encoding="utf-8"):
                  raise RuntimeError(f"{path} does not contain release version {version}")

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"version={version}\n")

      - name: Capture checked-out master commit
        id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Ensure release does not already exist
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "Release $VERSION already exists"
            exit 1
          fi
          if git rev-parse "$VERSION" >/dev/null 2>&1; then
            echo "Tag $VERSION already exists"
            exit 1
          fi

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          gh release create "$VERSION" \
            --target "$SOURCE_SHA" \
            --title "$VERSION" \
            --generate-notes
