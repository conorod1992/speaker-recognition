name: Post-sweep release sync

on:
  push:
    branches:
      - chore/post-sweep-release
    paths:
      - .github/workflows/post-sweep-release-sync.yml

permissions:
  contents: write

jobs:
  sync-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v6
        with:
          ref: chore/post-sweep-release

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.9"

      - name: Bump tracked release versions
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          version = "2.8.0"
          replacements = {
              Path("pyproject.toml"): (r'(?m)^version = ".*"$', f'version = "{version}"'),
              Path("speaker_recognition/api.py"): (r'(?m)^    version=".*",$', f'    version="{version}",'),
              Path("speaker_recognition_addon/speaker_recognition/api.py"): (r'(?m)^    version=".*",$', f'    version="{version}",'),
              Path("custom_components/speaker_recognition/manifest.json"): (r'(?m)^  "version": ".*"$', f'  "version": "{version}"'),
              Path("speaker_recognition_addon/config.yaml"): (r'(?m)^version: ".*"$', f'version: "{version}"'),
              Path("speaker_recognition_addon/Dockerfile"): (r'(?m)^ARG BUILD_VERSION=".*"$', f'ARG BUILD_VERSION="{version}"'),
              Path(".github/workflows/quality.yml"): (r'(?m)^            BUILD_VERSION=\S+$', f'            BUILD_VERSION={version}'),
          }
          for path, (pattern, replacement) in replacements.items():
              content = path.read_text(encoding="utf-8")
              updated, count = re.subn(pattern, replacement, content)
              if count != 1:
                  raise RuntimeError(f"Expected one release version in {path}, found {count}")
              path.write_text(updated, encoding="utf-8")
          PY

      - name: Regenerate uv lockfile
        run: uv lock --python 3.9

      - name: Remove one-shot workflow
        run: rm .github/workflows/post-sweep-release-sync.yml

      - name: Commit generated release state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "chore: prepare 2.8.0 release state"
          git push origin HEAD:chore/post-sweep-release
