name: Pre-release metadata sync

on:
  push:
    branches:
      - fix/final-pre-release-sweep

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: fix/final-pre-release-sweep

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.9"

      - name: Correct README compatibility text
        shell: python
        run: |
          from pathlib import Path

          path = Path("README.md")
          text = path.read_text(encoding="utf-8")
          replacements = {
              "python-3.8%20%7C%203.9-blue": "python-3.9-blue",
              "The package currently supports Python 3.8 and 3.9.": "The package currently supports Python 3.9.",
              "The packaged backend/client currently supports Python 3.8 and 3.9.": "The packaged backend/client currently supports Python 3.9.",
          }
          for old, new in replacements.items():
              if old not in text:
                  raise RuntimeError(f"Expected README text not found: {old}")
              text = text.replace(old, new)
          path.write_text(text, encoding="utf-8")

      - name: Regenerate lockfile
        run: uv lock --python 3.9

      - name: Remove obsolete semantic-release config
        run: rm -f .releaserc

      - name: Commit generated metadata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md uv.lock .releaserc
          if git diff --cached --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git commit -m "chore: sync final pre-release metadata"
          git push origin HEAD:fix/final-pre-release-sweep
