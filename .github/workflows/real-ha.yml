name: Real Home Assistant

on:
  workflow_dispatch:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
  push:
    branches:
      - master
  schedule:
    - cron: "30 0 * * *"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  HA_CORE_REPO: "home-assistant/core"
  HA_CORE_BRANCH: "dev"

jobs:
  prepare:
    name: Resolve HA Python version
    runs-on: ubuntu-latest
    outputs:
      python-version: ${{ steps.versions.outputs.python-version }}
    steps:
      - name: Read Python version from Home Assistant Core
        id: versions
        run: |
          PYTHON_VERSION="$(curl -fsSL "https://raw.githubusercontent.com/${{ env.HA_CORE_REPO }}/${{ env.HA_CORE_BRANCH }}/.python-version" | tr -d '\n')"
          test -n "$PYTHON_VERSION"
          echo "python-version=$PYTHON_VERSION" >> "$GITHUB_OUTPUT"
          echo "Home Assistant Python version: $PYTHON_VERSION"

  real-ha:
    name: Home Assistant (${{ matrix.home-assistant }})
    runs-on: ubuntu-latest
    needs: prepare
    timeout-minutes: 20
    continue-on-error: ${{ matrix.home-assistant == 'upcoming' && github.event_name == 'pull_request' }}
    strategy:
      fail-fast: false
      matrix:
        home-assistant:
          - stable
          - upcoming
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ needs.prepare.outputs.python-version }}
          allow-prereleases: true
          cache: pip
          cache-dependency-path: tests_real_ha/requirements.txt

      - name: Install Real HA test harness
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r tests_real_ha/requirements.txt

      - name: Install latest stable Home Assistant
        if: matrix.home-assistant == 'stable'
        run: python -m pip install --upgrade homeassistant

      - name: Install upcoming Home Assistant Core dev
        if: matrix.home-assistant == 'upcoming'
        run: |
          python -m pip install --upgrade --force-reinstall \
            "git+https://github.com/${{ env.HA_CORE_REPO }}.git@${{ env.HA_CORE_BRANCH }}"

      - name: Install Home Assistant integration dependency requirements
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import subprocess
          import sys

          import homeassistant

          components = Path(next(iter(homeassistant.__path__))) / "components"
          custom_manifest = json.loads(
              Path("custom_components/speaker_recognition/manifest.json").read_text()
          )

          requirements = set(custom_manifest.get("requirements", []))
          pending = [
              *custom_manifest.get("dependencies", []),
              *custom_manifest.get("after_dependencies", []),
          ]
          visited = set()

          while pending:
              domain = pending.pop()
              if domain in visited:
                  continue
              visited.add(domain)

              manifest_path = components / domain / "manifest.json"
              if not manifest_path.exists():
                  raise RuntimeError(
                      f"Home Assistant dependency manifest not found: {domain}"
                  )

              manifest = json.loads(manifest_path.read_text())
              requirements.update(manifest.get("requirements", []))
              pending.extend(manifest.get("dependencies", []))
              pending.extend(manifest.get("after_dependencies", []))

          print("Resolved HA dependency integrations:", ", ".join(sorted(visited)))
          if requirements:
              print("Installing HA integration requirements:", *sorted(requirements))
              subprocess.check_call(
                  [sys.executable, "-m", "pip", "install", *sorted(requirements)]
              )
          PY

      - name: Show resolved versions
        run: |
          python - <<'PY'
          from importlib.metadata import version
          print("homeassistant=" + version("homeassistant"))
          print("pytest-homeassistant-custom-component=" + version("pytest-homeassistant-custom-component"))
          PY

      - name: Verify stable dependency environment
        if: matrix.home-assistant == 'stable'
        run: python -m pip check

      - name: Run Real HA tests
        run: python -m pytest tests_real_ha -v --tb=short --asyncio-mode=auto
