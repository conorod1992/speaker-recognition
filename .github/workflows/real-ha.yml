name: Real Home Assistant

on:
  workflow_dispatch:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
  push:
    branches:
      - master

jobs:
  real-ha:
    name: Home Assistant 2026.9
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: tests_real_ha/requirements.txt

      - name: Install Real HA test dependencies
        run: python -m pip install -r tests_real_ha/requirements.txt

      - name: Run Real HA tests
        run: python -m pytest tests_real_ha -v --tb=short
