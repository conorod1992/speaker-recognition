name: Code Quality

on:
  workflow_dispatch:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
  push:
    branches:
      - master
  schedule:
    - cron: "0 0 * * *"

jobs:
  hacs:
    name: Validate HACS integration
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: HACS validation
        uses: hacs/action@main
        with:
          category: integration
          # Repository topics and Issues are GitHub settings; they do not affect
          # installation of this custom integration.
          ignore: issues topics

  version-consistency:
    name: Verify release versions
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Check version-bearing files
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          import re

          pyproject = Path("pyproject.toml").read_text(encoding="utf-8")
          package = re.search(r'(?m)^version = "([^"]+)"$', pyproject)
          if package is None:
              raise SystemExit("Could not read pyproject version")
          expected = package.group(1)

          manifest = json.loads(Path("custom_components/speaker_recognition/manifest.json").read_text(encoding="utf-8"))
          addon = Path("speaker_recognition_addon/config.yaml").read_text(encoding="utf-8")
          addon_version = re.search(r'(?m)^version: "([^"]+)"$', addon)
          dockerfile = Path("speaker_recognition_addon/Dockerfile").read_text(encoding="utf-8")
          docker_default = re.search(r'(?m)^ARG BUILD_VERSION="([^"]+)"$', dockerfile)
          quality = Path(".github/workflows/quality.yml").read_text(encoding="utf-8")
          smoke_build = re.search(r'(?m)^            BUILD_VERSION=([^\s]+)$', quality)

          api_versions = []
          for path in (
              Path("speaker_recognition/api.py"),
              Path("speaker_recognition_addon/speaker_recognition/api.py"),
          ):
              match = re.search(r'(?m)^    version="([^"]+)",$', path.read_text(encoding="utf-8"))
              if match is None:
                  raise SystemExit(f"Could not read API version from {path}")
              api_versions.append(match.group(1))

          found = {
              "manifest": manifest.get("version"),
              "addon": addon_version.group(1) if addon_version else None,
              "addon Docker default": docker_default.group(1) if docker_default else None,
              "backend API": api_versions[0],
              "add-on API": api_versions[1],
              "CI add-on smoke build": smoke_build.group(1) if smoke_build else None,
          }
          mismatches = {name: value for name, value in found.items() if value != expected}
          if mismatches:
              raise SystemExit(f"Expected version {expected}; mismatches: {mismatches}")
          print(f"All release versions match {expected}")
          PY

  cache:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.9"
          enable-cache: true
          cache-suffix: uv-${{ runner.os }}-3.9

      - name: Install dependecies
        run: uv sync --locked --all-groups

  ruff:
    needs: cache
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.9"
          enable-cache: true
          cache-suffix: uv-${{ runner.os }}-3.9

      - name: Install dependecies
        run: uv sync --locked --all-groups

      - name: Run ruff
        run: |
          uv run ruff check speaker_recognition tests

  mypy:
    needs: cache
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.9"
          enable-cache: true
          cache-suffix: uv-${{ runner.os }}-3.9

      - name: Install dependecies
        run: uv sync --locked --all-groups

      - name: Run mypy
        run: |
          uv run mypy --strict speaker_recognition

  tests:
    needs: cache
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.9"
          enable-cache: true
          cache-suffix: uv-${{ runner.os }}-3.9

      - name: Install dependecies
        run: uv sync --locked --all-groups

      - name: Run tests
        run: |
          uv run pytest --cov=. --cov-report=term tests -v

  find-addons:
    name: Find add-ons
    runs-on: ubuntu-latest
    outputs:
      addons: ${{ steps.addons.outputs.addons_list }}
    steps:
      - name: Check out code from GitHub
        uses: actions/checkout@v6

      - name: Find add-on directories
        id: addons
        uses: home-assistant/actions/helpers/find-addons@master

  lint-addon:
    name: Lint add-on ${{ matrix.path }}
    runs-on: ubuntu-latest
    needs: find-addons
    strategy:
      matrix:
        path: ${{ fromJson(needs.find-addons.outputs.addons) }}
    steps:
      - name: Check out code from GitHub
        uses: actions/checkout@v6

      - name: Run Home Assistant Add-on Lint
        uses: frenck/action-addon-linter@v2
        with:
          path: "./${{ matrix.path }}"

  addon-sources:
    name: Verify add-on source copy
    runs-on: ubuntu-latest
    steps:
      - name: Check out code from GitHub
        uses: actions/checkout@v6

      - name: Check committed backend copy
        run: python scripts/sync_addon_sources.py --check

  build-addon:
    name: Build ${{ matrix.arch }} add-on
    if: github.event_name != 'schedule'
    needs:
      - addon-sources
      - lint-addon
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
          - arch: aarch64
            platform: linux/arm64
    steps:
      - name: Check out code from GitHub
        uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build add-on from Supervisor context
        uses: docker/build-push-action@v6
        with:
          context: ./speaker_recognition_addon
          platforms: ${{ matrix.platform }}
          build-args: |
            BUILD_ARCH=${{ matrix.arch }}
            BUILD_VERSION=2.8.1
          load: ${{ matrix.arch == 'amd64' }}
          push: false
          tags: speaker-recognition-addon:test

      - name: Prepare smoke-test volumes
        if: matrix.arch == 'amd64'
        run: |
          mkdir -p \
            "${RUNNER_TEMP}/speaker-recognition/data" \
            "${RUNNER_TEMP}/speaker-recognition/share" \
            "${RUNNER_TEMP}/speaker-recognition/supervisor/addons/self/options"
          printf '%s\n' '{"host":"0.0.0.0","port":8099,"log_level":"info","access_log":true,"embeddings_dir":"/share/speaker_recognition/embeddings","api_token":"smoke-api-token","allow_insecure_remote":false}' > "${RUNNER_TEMP}/speaker-recognition/data/options.json"
          printf '%s\n' '{"result":"ok","data":{"host":"0.0.0.0","port":8099,"log_level":"info","access_log":true,"embeddings_dir":"/share/speaker_recognition/embeddings","api_token":"smoke-api-token","allow_insecure_remote":false}}' > "${RUNNER_TEMP}/speaker-recognition/supervisor/addons/self/options/config"

      - name: Start mock Supervisor API
        if: matrix.arch == 'amd64'
        run: |
          docker network create speaker-recognition-smoke
          docker run --detach \
            --name supervisor \
            --network speaker-recognition-smoke \
            --volume "${RUNNER_TEMP}/speaker-recognition/supervisor:/mock:ro" \
            python:3.13-alpine \
            python -m http.server 80 --directory /mock

      - name: Start add-on container
        if: matrix.arch == 'amd64'
        run: |
          docker run --detach \
            --name speaker-recognition-smoke \
            --network speaker-recognition-smoke \
            --env SUPERVISOR_TOKEN=smoke-test-token \
            --publish 18099:8099 \
            --volume "${RUNNER_TEMP}/speaker-recognition/data:/data" \
            --volume "${RUNNER_TEMP}/speaker-recognition/share:/share" \
            speaker-recognition-addon:test

      - name: Wait for healthy API
        if: matrix.arch == 'amd64'
        run: |
          for attempt in {1..90}; do
            if curl --fail --silent --user 'smoke-api-token:' http://127.0.0.1:18099/health | grep --quiet '"status":"healthy"'; then
              exit 0
            fi
            if ! docker inspect --format '{{.State.Running}}' speaker-recognition-smoke | grep --quiet true; then
              docker logs speaker-recognition-smoke
              exit 1
            fi
            sleep 2
          done
          docker logs speaker-recognition-smoke
          exit 1

      - name: Show add-on logs
        if: always() && matrix.arch == 'amd64'
        run: docker logs speaker-recognition-smoke || true

      - name: Stop smoke-test container
        if: always() && matrix.arch == 'amd64'
        run: |
          docker rm --force speaker-recognition-smoke || true
          docker rm --force supervisor || true
          docker network rm speaker-recognition-smoke || true
