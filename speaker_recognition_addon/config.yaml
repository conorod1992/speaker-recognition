name: Speaker Recognition
# Do not pre-bump this on master. The Release workflow advances it only after
# both architecture-specific GHCR image tags for the target version exist.
version: "3.0.2"
slug: speaker_recognition
description: Speaker recognition service using voice embeddings for identification
url: https://github.com/conorod1992/speaker-recognition/tree/master/speaker_recognition_addon
image: ghcr.io/conorod1992/{arch}-speaker-recognition-addon
arch:
  - amd64
  - aarch64
init: false
startup: services
hassio_api: true
ports:
  8099/tcp: 8099
ports_description:
  8099/tcp: Speaker Recognition API
map:
  - type: share
    read_only: false
options:
  host: "0.0.0.0"
  port: 8099
  log_level: "info"
  access_log: true
  embeddings_dir: "/share/speaker_recognition/embeddings"
  model_cache_dir: "/share/speaker_recognition/models"
  shadow_engine: "none"
  api_token: ""
  allow_insecure_remote: false
schema:
  host: str
  port: port
  log_level: list(debug|info|warning|error|critical)
  access_log: bool
  embeddings_dir: str
  model_cache_dir: str
  shadow_engine: list(none|ecapa_tdnn)
  api_token: password
  allow_insecure_remote: bool
