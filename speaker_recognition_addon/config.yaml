name: Speaker Recognition
version: "2.8.0"
slug: speaker_recognition
description: Speaker recognition service using voice embeddings for identification
url: https://github.com/conorod1992/speaker-recognition/tree/master/speaker_recognition_addon
arch:
  - amd64
  - aarch64
init: false
startup: services
ports:
  8099/tcp: 8099
ports_description:
  8099/tcp: Speaker Recognition API
map:
  - type: share
    read_only: false
options:
  host: "0.0.0.0"
  port: 8099
  log_level: "info"
  access_log: true
  embeddings_dir: "/share/speaker_recognition/embeddings"
  api_token: ""
  allow_insecure_remote: false
schema:
  host: str
  port: port
  log_level: list(debug|info|warning|error|critical)
  access_log: bool
  embeddings_dir: str
  api_token: password
  allow_insecure_remote: bool
