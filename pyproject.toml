[project]
name = "hass-speaker-recognition"
version = "1.2.0"
description = "Speaker recognition for Home Assistant using Resemblyzer"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "httpx>=0.24.0",
    "pydantic>=2.0.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["speaker_recognition*"]

[project.optional-dependencies]
server = [
    "fastapi>=0.68.1",
    "python-dotenv>=0.20.0",
    "torch>=1.9.0,<3.0.0; python_version < '3.10'",
    "resemblyzer>=0.1.3; python_version < '3.10'",
    "setuptools>=59.6.0,<81",
    "typer>=0.10.0",
    "uvicorn>=0.16.0",
]

[dependency-groups]
dev = [
    "mypy>=1.10.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.12.5",
    "types-requests>=2.32.0",
]
server = [
    "fastapi>=0.68.1",
    "python-dotenv>=0.20.0",
    "torch>=1.9.0,<3.0.0; python_version < '3.10'",
    "resemblyzer>=0.1.3; python_version < '3.10'",
    "setuptools>=59.6.0,<81",
    "typer>=0.10.0",
    "uvicorn>=0.16.0",
]

[tool.pytest.ini_options]
asyncio_mode = "strict"

[tool.mypy]
python_version = "3.9"
strict = true
packages = ["speaker_recognition"]

[[tool.mypy.overrides]]
module = ["resemblyzer", "webrtcvad"]
ignore_missing_imports = true

[tool.ruff]
target-version = "py39"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
"custom_components/**/*.py" = ["UP006", "UP007"]
